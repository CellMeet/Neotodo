<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hello Paper</title>
  <link rel="stylesheet" href="plugin.css">
</head>
<body>
  <main class="hello">
    <div class="hello-card">
      <p class="hello-kicker">A community plugin</p>
      <h1>Hello, paper.</h1>
      <p class="hello-copy">This starter lives in its own folder and runs in an iframe. Change the words, keep the calm.</p>
      <button class="hello-button" type="button" data-hello-count>
        <span data-hello-number>0</span> quiet wins
      </button>
      <p class="hello-note" data-hello-note>Click the button to add one.</p>
    </div>
  </main>
  <script src="plugin.js"></script>
</body>
</html>
