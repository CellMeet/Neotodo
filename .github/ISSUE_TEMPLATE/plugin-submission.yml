name: Plugin submission
description: Share a NeoTodo plugin with the community catalog
title: "[Plugin] "
labels: ["plugin", "community"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for building a small thing for NeoTodo. If you can, open a pull
        request against `community/catalog.json` instead — it is faster to
        review. Use this form when you would rather have a maintainer prepare
        the entry.
  - type: input
    id: plugin-name
    attributes:
      label: Plugin name
      placeholder: My Plugin / 我的插件
    validations:
      required: true
  - type: input
    id: plugin-id
    attributes:
      label: Plugin id
      description: Lowercase letters, numbers and hyphens. Must be unique.
      placeholder: my-plugin
    validations:
      required: true
  - type: input
    id: author
    attributes:
      label: Author
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: 1.0.0
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What does it do?
      description: One or two calm sentences.
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: Source repository
      placeholder: https://github.com/you/my-plugin
    validations:
      required: true
  - type: input
    id: download
    attributes:
      label: Download URL (.zip)
      description: A public https:// link to the packaged plugin.
      placeholder: https://github.com/you/my-plugin/releases/download/v1.0.0/my-plugin-1.0.0.zip
    validations:
      required: true
  - type: input
    id: sha256
    attributes:
      label: sha256
      description: Printed by `python3 tools/pack-plugin.py`.
      placeholder: 64 lowercase hex characters
  - type: input
    id: homepage
    attributes:
      label: Homepage or docs
      placeholder: https://github.com/you/my-plugin
  - type: input
    id: license
    attributes:
      label: License
      placeholder: MIT
  - type: input
    id: category
    attributes:
      label: Category
      placeholder: Interface / Play / Productivity / Utility / AI
  - type: input
    id: tags
    attributes:
      label: Tags
      description: Up to six short words, separated by commas.
  - type: checkboxes
    id: confirmations
    attributes:
      label: Checklist
      options:
        - label: The plugin is my own work or is compatible with the license I listed.
          required: true
        - label: The plugin does not collect personal data or upload notebook content.
          required: true
        - label: The archive has `manifest.json` at its root and installs with **Settings → Community → Install from .zip**.
          required: true
        - label: I have tested light and dark postcards.
          required: true
  - type: textarea
    id: notes
    attributes:
      label: Anything else
      description: Screenshots, changelog, review notes.
