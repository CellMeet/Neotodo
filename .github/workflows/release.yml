name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    name: Windows x64 installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install PySide6 pyinstaller
      - name: Build NeoTodo.exe
        run: >
          pyinstaller --noconfirm --clean --onefile --windowed
          --name NeoTodo
          --icon icon-check.ico
          --add-data "web;web"
          --add-data "icon-check.png;."
          --add-data "icon.svg;."
          --collect-all PySide6
          windows_app.py
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Build Windows installer
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: dist/NeoTodo-*-setup.exe
          if-no-files-found: error

  linux:
    name: Linux source package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package Linux source
        run: |
          mkdir -p dist
          tar --exclude='.git' --exclude='__pycache__' --exclude='*.pyc' \
              --exclude='.venv' --exclude='dist' \
              -czf dist/NeoTodo-0.0.1-Linux-x86_64.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: linux-package
          path: dist/NeoTodo-*-Linux-x86_64.tar.gz
          if-no-files-found: error

  release:
    name: Publish GitHub release
    needs: [windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: NeoTodo ${{ github.ref_name }}
          files: release-assets/*
          generate_release_notes: true
          make_latest: true
