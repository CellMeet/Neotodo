<!doctype html>
<html lang="zh-CN" data-sb-dark="false">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>收纳箱 · NeoTodo</title>
  <!-- The control page wears the notebook's live theme. -->
  <script src="../plugin-theme.js"></script>
  <script>
    // Read the parent theme first so the page never flashes a bright card in a
    // dark notebook; the host repeats the theme through postMessage afterwards.
    try {
      if (window.parent !== window) {
        const parentRoot = window.parent.document.documentElement;
        if (parentRoot.dataset.postcardDark === "true") {
          document.documentElement.dataset.sbDark = "true";
        }
      }
    } catch (error) {}
    window.addEventListener("message", (event) => {
      if (event.data?.type !== "neotodo-theme") return;
      document.documentElement.dataset.sbDark = event.data.dark ? "true" : "false";
    });
    document.documentElement.classList.add("sb-booting");
  </script>
  <link rel="stylesheet" href="plugin.css">
  <link rel="stylesheet" href="../plugin-theme.css">
</head>
<body>
  <main class="sb-page">
    <button class="sb-close" type="button" data-close aria-label="Close Storage Box">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
    </button>

    <section class="sb-hero">
      <div class="sb-stage" aria-hidden="true">
        <div class="sb-stage-list">
          <span class="sb-stage-row"><i style="--c:#e8875b"></i><b>Neotodo</b></span>
          <span class="sb-stage-row"><i style="--c:#7fb069"></i><b>阅读模式</b></span>
          <span class="sb-stage-row"><i style="--c:#7c9ef5"></i><b>壁纸功能</b></span>
          <span class="sb-stage-row sb-stage-row-away"><i style="--c:#c8b9fc"></i><b>餐饮记录</b></span>
        </div>

        <div class="sb-stage-box">
          <div class="sb-stage-box-head">
            <img src="storage-box.svg" alt="">
            <span>收纳箱</span>
            <em>2</em>
          </div>
          <div class="sb-stage-box-list">
            <span class="sb-stage-chip"><i style="--c:#c8b9fc"></i>餐饮记录<b>↩</b></span>
            <span class="sb-stage-chip"><i style="--c:#e0b23e"></i>旧项目<b>↩</b></span>
          </div>
        </div>

        <span class="sb-stage-arrow" aria-hidden="true">→</span>
      </div>

      <div class="sb-title">
        <span class="sb-kicker">PLUGIN · INTERFACE</span>
        <h1>收纳箱</h1>
        <p>把暂时不用的分类收起来，列表也跟着清爽。</p>
      </div>

      <div class="sb-copy">
        <p>开启后，左下角的工具栏里会出现一只箱子。点一下它，箱子的图标就滑到 Categories 的下边线；再点一下，收纳箱收起，里面的分类原样留着。</p>
        <p>点箱子图标，箱内的分类会展开，再点一下合上。这时点任意分类，它就会被放进箱子；点箱内的分类，它会回到列表的最后面。</p>
      </div>

      <button class="sb-power" id="sb-power" type="button" aria-pressed="true">
        <span class="sb-power-copy">
          <strong id="sb-power-title">Storage Box is on</strong>
          <small id="sb-power-detail">左栏工具里会保留收纳箱按钮。</small>
        </span>
        <span class="sb-switch" aria-hidden="true"><span class="sb-thumb"></span></span>
      </button>

      <button class="sb-open" id="sb-open" type="button">
        <img src="storage-box.svg" alt="">
        <span>打开收纳箱</span>
      </button>

      <div class="sb-hints">
        <span><b>Click</b> 分类放进箱子</span>
        <span><b>Box</b> 查看箱内分类</span>
        <span><b>Return</b> 放回列表最后</span>
      </div>

      <button class="sb-done" type="button" data-close>Back to NeoTodo</button>
    </section>
  </main>

  <script src="plugin.js"></script>
</body>
</html>
