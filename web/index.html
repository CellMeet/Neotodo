      <div class="head-right">
        <span class="week-stamp" id="week-stamp">—</span>

          <span class="ach-sticker" aria-hidden="true"><img src="/stickers/yuji-battle.jpg" alt=""></span>

          <span id="trophy-count">0</span>
        </button>
        <div class="tomato-counter" data-action="open-timer-achievement" aria-label="Pomodoro achievement">
          <span class="ach-sticker" aria-hidden="true"><img src="/stickers/gojo-battle.jpg" alt=""></span>
          <svg class="tomato-glyph" aria-hidden="true"><use href="#tomato-clock"></use></svg>
          <span id="tomato-count">0</span>
        </div>
      </div>
    </header>

    <main class="notebook">
      <aside class="index">
        <div class="index-head">
          <span>Categories</span>
          <button class="plus-button" data-action="add-category">+</button>
        </div>
        <div id="category-list" class="category-list"></div>
        <div class="index-foot" id="category-summary"></div>
      </aside>
      <section class="page" id="stage"></section>
    </main>

  </div>

      <svg class="sound-icon" aria-hidden="true"><use href="#music"></use></svg>
    </button>

    </button>
    <button id="settings-button" class="settings-button" type="button" data-action="open-settings" aria-label="Settings">
      <svg class="gear-icon" aria-hidden="true"><use href="#gear"></use></svg>

    <button id="exit-button" class="exit-button" type="button" data-action="quit-app" aria-label="Quit NeoTodo">

    <button class="tool-button terminal-tool" type="button" data-action="open-terminal" aria-label="AI terminal">
      <svg aria-hidden="true"><use href="#terminal-icon"></use></svg>
    </button>
  </div>


  <aside class="archive-drawer" id="archive-drawer" aria-hidden="true">
    <div class="drawer-head">
      <div>

    if (new URLSearchParams(location.search).has("snapshot")) {

        const request = new XMLHttpRequest();
        request.open("GET", "/api/state", false);
        request.send();
        window.__SNAPSHOT_STATE__ = JSON.parse(request.responseText);
      } catch (error) {}
    }
  </script>
