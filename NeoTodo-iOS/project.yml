name: NeoTodo
options:
  bundleIdPrefix: io.github
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: true

settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "15.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"
    ENABLE_TESTABILITY: "YES"
    CLANG_WARN_QUOTED_INCLUDE_IN_FRAMEWORK_HEADER: "NO"
    GENERATE_INFOPLIST_FILE: "NO"
    SWIFT_EMIT_LOC_STRINGS: "NO"
    ALWAYS_SEARCH_USER_PATHS: "NO"
    LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks"

targets:
  NeoTodo:
    type: application
    platform: iOS
    sources:
      - path: NeoTodo
        excludes:
          - "Resources/Info.plist"
      # The Python backend is copied verbatim into NeoTodo.app/app/ so that
      # PYTHONPATH points at the same tree the desktop build runs.
      - path: app
        type: folder
        buildPhase: resources
    dependencies:
      - framework: Python.xcframework
        embed: true
        codeSign: true
    settings:
      base:
        PRODUCT_NAME: NeoTodo
        PRODUCT_BUNDLE_IDENTIFIER: io.github.neotodo
        INFOPLIST_FILE: NeoTodo/Resources/Info.plist
        SWIFT_OBJC_BRIDGING_HEADER: NeoTodo/NeoTodo-Bridging-Header.h
        FRAMEWORK_SEARCH_PATHS: "$(inherited) $(PROJECT_DIR)"
        HEADER_SEARCH_PATHS: "$(inherited) $(BUILT_PRODUCTS_DIR)/Python.framework/Headers"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        SUPPORTS_MACCATALYST: "NO"
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: "NO"
    postBuildScripts:
      - name: Process Python libraries
        basedOnDependencyAnalysis: false
        shell: /bin/sh
        script: |
          set -eu
          cd "$PROJECT_DIR"
          if [ ! -d Python.xcframework ]; then
            echo "error: Python.xcframework is missing. Run Scripts/fetch-python.sh first." >&2
            exit 1
          fi
          # Installs the CPython standard library next to the app sources and
          # turns any binary module into a signed framework (App Store rule).
          source "Python.xcframework/build/utils.sh"
          install_python Python.xcframework app

          BUNDLE="$BUILT_PRODUCTS_DIR/$CONTENTS_FOLDER_PATH"
          if [ ! -d "$BUNDLE/python" ]; then
            echo "error: the Python standard library was not installed into $BUNDLE." >&2
            exit 1
          fi
          # The app/ folder is a folder reference, so it is normally already in
          # the bundle; this keeps the layout correct if it is not.
          if [ ! -f "$BUNDLE/app/app.py" ]; then
            rm -rf "$BUNDLE/app"
            cp -R app "$BUNDLE/app"
          fi

schemes:
  NeoTodo:
    build:
      targets:
        NeoTodo: all
    run:
      config: Debug
    archive:
      config: Release
