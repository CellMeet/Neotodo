plugins {
    id 'com.android.application'
    id 'com.chaquo.python'
}

android {
    namespace 'io.github.neotodo'
    compileSdk 35

    defaultConfig {
        applicationId "io.github.neotodo"
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName "0.0.1"

        ndk {
            // arm64 for phones/tablets, x86_64 for the desktop emulator.
            abiFilters "arm64-v8a", "x86_64"
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix ""
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        jniLibs {
            useLegacyPackaging false
        }
    }
}

chaquopy {
    defaultConfig {
        version = "3.12"
        buildPython "/usr/bin/python3.12"
        pyc {
            src = false
        }
    }
}
