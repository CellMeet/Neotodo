# /etc/nginx/sites-available/neotodo-downloads
#
# Static host for the NeoTodo download page and the plugin catalog.
#
#   sudo ln -s /etc/nginx/sites-available/neotodo-downloads \
#              /etc/nginx/sites-enabled/neotodo-downloads
#   sudo nginx -t && sudo systemctl reload nginx
#
# Replace dl.example.com with your domain (or the server IP while testing).
# For HTTPS either run `sudo certbot --nginx -d dl.example.com` or upload an
# Aliyun SSL certificate and add the commented 443 server block below.

server {
    listen 80;
    listen [::]:80;
    server_name dl.example.com;

    root /var/www/neotodo-downloads;
    index index.html;

    charset utf-8;
    default_type application/octet-stream;
    server_tokens off;
    sendfile on;
    tcp_nopush on;

    # The catalog and the page are small; archives are already compressed.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        image/svg+xml;

    # The app fetches this file from a different origin. CORS keeps the same
    # JSON usable by the website (same origin), the app (urllib) and any future
    # web client, without opening up the static page itself.
    location = /plugins/catalog.json {
        add_header Cache-Control "public, max-age=300";
        add_header Access-Control-Allow-Origin "*" always;
        try_files $uri =404;
    }

    location = /downloads.json {
        add_header Cache-Control "public, max-age=300";
        try_files $uri =404;
    }

    location /plugins/icons/ {
        add_header Cache-Control "public, max-age=86400";
        add_header Access-Control-Allow-Origin "*" always;
        try_files $uri =404;
    }

    # Plugin archives are content-addressed by release (name + checksum in the
    # catalog), so they can be cached for a year.
    location /plugins/files/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Access-Control-Allow-Origin "*" always;
        try_files $uri =404;
    }

    # Installers, source packages, APKs. Same immutable rule: a new release
    # gets a new file name in downloads.json.
    location /files/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        try_files $uri $uri/ =404;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Optional: keep the access log, it is the only "download counter" this
    # site needs. `grep ' /files/' /var/log/nginx/access.log | wc -l`
    access_log /var/log/nginx/neotodo-downloads.access.log;
    error_log  /var/log/nginx/neotodo-downloads.error.log;
}

# HTTPS: after `sudo certbot --nginx -d dl.example.com`, certbot writes this
# block for you. If you use an Aliyun certificate instead, uncomment and point
# the paths at the uploaded .pem/.key files.
#
# server {
#     listen 443 ssl http2;
#     listen [::]:443 ssl http2;
#     server_name dl.example.com;
#
#     ssl_certificate     /etc/nginx/certs/dl.example.com.pem;
#     ssl_certificate_key /etc/nginx/certs/dl.example.com.key;
#     ssl_protocols TLSv1.2 TLSv1.3;
#
#     root /var/www/neotodo-downloads;
#     index index.html;
#     # ... repeat the gzip and location blocks from the port 80 server ...
# }
