<!doctype html>
<html lang="zh-CN" data-hb-dark="false" data-hb-style="blue">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Head Bar · NeoTodo</title>
  <!-- The control page wears the notebook's live theme. -->
  <script src="../plugin-theme.js"></script>
  <script>
    try {
      if (window.parent !== window) {
        const parentRoot = window.parent.document.documentElement;
        if (parentRoot.dataset.postcardDark === "true") {
          document.documentElement.dataset.hbDark = "true";
        }
      }
    } catch (error) {}
    document.documentElement.classList.add("hb-booting");
  </script>
  <link rel="stylesheet" href="plugin.css">
  <link rel="stylesheet" href="../plugin-theme.css">
</head>
<body>
  <main class="hb-page">
    <button class="hb-close" type="button" data-close aria-label="Close Head Bar">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
    </button>

    <section class="hb-hero">
      <div class="hb-stage" aria-hidden="true">
        <span class="hb-stage-island"></span>
        <span class="hb-stage-clock">21:08</span>
      </div>

      <div class="hb-title">
        <span class="hb-kicker">PLUGIN · INTERFACE</span>
        <h1>Head Bar</h1>
        <p>悬停时钟，让短短的海盐色水晶小岛从上边框滑出。</p>
      </div>

      <div class="hb-copy">
        <p>点击小岛，整个工作区向上收起，只留下原始壁纸，小岛也会隐藏。把光标移回顶部，小岛会再次出现，点击就能恢复原状。它安静地藏在顶部，不占用任何空间。</p>
        <p>在 Settings → Plugins 里可以切换「推拉」或「火光烧尽」：后者会让纸张发黑、卷起、冒烟，恢复时整段动画倒放。还能选择海之盐的蓝瓶或粉瓶。</p>
      </div>

      <button class="hb-power" id="hb-power" type="button" aria-pressed="true">
        <span class="hb-power-copy">
          <strong id="hb-power-title">Head Bar is on</strong>
          <small id="hb-power-detail">悬停时间数字即可唤出灵动岛。</small>
        </span>
        <span class="hb-switch" aria-hidden="true"><span class="hb-thumb"></span></span>
      </button>

      <div class="hb-style-picker" role="group" aria-label="Bottle style">
        <span class="hb-style-label">Sea Salt bottle</span>
        <div class="hb-style-options">
          <button class="hb-style-option active" type="button" data-hb-style="blue" aria-pressed="true">
            <span class="hb-style-swatch blue" aria-hidden="true"></span>
            <span class="hb-style-copy"><strong>海之盐 · 蓝</strong><small>Sea Salt Blue</small></span>
          </button>
          <button class="hb-style-option" type="button" data-hb-style="pink" aria-pressed="false">
            <span class="hb-style-swatch pink" aria-hidden="true"></span>
            <span class="hb-style-copy"><strong>海之盐 · 粉</strong><small>Sea Salt Pink</small></span>
          </button>
        </div>
      </div>

      <div class="hb-hints">
        <span><b>Hover</b> 时间数字</span>
        <span><b>Click</b> 收起工作区</span>
        <span><b>Again</b> 恢复</span>
      </div>

      <button class="hb-done" type="button" data-close>Back to NeoTodo</button>
    </section>
  </main>

  <script src="plugin.js"></script>
</body>
</html>
